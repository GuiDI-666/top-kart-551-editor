name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: 语法检查 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 编译全部 Python 源文件
        run: python -m compileall -q . -x '(^|/)(\.venv|build|dist)/'

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check .

  hygiene:
    name: 仓库卫生检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 禁止提交游戏原始文件
        run: |
          set -e
          bad=$(git ls-files | grep -Ei '\.(dll|exe|bin|pdb|so|dylib)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::仓库中不允许包含二进制游戏文件："
            echo "$bad"
            exit 1
          fi
      - name: 禁止硬编码本机绝对路径
        run: |
          set -e
          if grep -rnE '"[A-Za-z]:[\\/]' --include='*.py' --include='*.spec' . ; then
            echo "::error::检测到硬编码的 Windows 绝对路径，请改用环境变量或命令行参数"
            exit 1
          fi
          echo "未发现硬编码绝对路径"
      - name: 禁止提交明显的凭据
        run: |
          set -e
          # 排除本文件：它自身包含检测用的模式字面量，会命中自己
          pattern='(ghp_|gho_|ghs_|github_pat_|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          hits=$(git ls-files | grep -v '^\.github/workflows/ci\.yml$' | xargs -r grep -InE "$pattern" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::检测到疑似凭据，请立即移除并轮换"
            echo "$hits"
            exit 1
          fi
          echo "未发现疑似凭据"
      - name: 检查必需文件
        run: |
          set -e
          for f in README.md LICENSE CHANGELOG.md CONTRIBUTING.md SECURITY.md requirements.txt VERSION; do
            [ -f "$f" ] || { echo "::error::缺少必需文件 $f"; exit 1; }
          done
          echo "必需文件齐全"
